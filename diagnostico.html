<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Diagnóstico Gerencial</title>

<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f7fa;
  color: #1f2937;
  margin: 0;
}

#loading {
  text-align: center;
  padding: 80px 20px;
  font-size: 18px;
}

#error {
  display: none;
  max-width: 700px;
  margin: 80px auto;
  padding: 30px;
  background: white;
  border-radius: 10px;
  text-align: center;
}

#relatorio {
  max-width: 1100px;
  margin: 0 auto;
  background: white;
  min-height: 100vh;
  padding: 30px;
  box-sizing: border-box;
}

/* Aviso exibido enquanto o PDF é gerado */
#gerando-pdf {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(15, 42, 71, .85);
  color: #fff;
  font: 600 16px Arial, Helvetica, sans-serif;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}
</style>

<!-- Gera o PDF por código (não depende da tela de impressão do celular) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<div id="loading">
  Carregando diagnóstico...
</div>

<div id="error">
  <h2>Diagnóstico não encontrado</h2>
  <p>Verifique se o link está correto.</p>
</div>

<div id="gerando-pdf">Gerando o PDF...<br>Aguarde alguns segundos.</div>

<div id="relatorio"></div>

<script>

var SUPABASE_URL = "https://nhhcxkklaiozjkchwceb.supabase.co";

var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oaGN4a2tsYWlvemprY2h3Y2ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxODkwNDQsImV4cCI6MjEwNTc2NTA0NH0.R6fcxWZH3jrm60kzD33f_NDeqkcWdHAsrlsnqg3zH5I";

var params = new URLSearchParams(window.location.search);
var leadId = params.get("id");
// preview=1 → abertura de conferência (não conta como clique)
var modoPrevia = params.get("preview") === "1";
// pdf=1 → gera e baixa o PDF automaticamente
var modoPdf = params.get("pdf") === "1";

var nomeEmpresa = "";
var gerandoPdf = false;

async function carregarDiagnostico() {

  if (!leadId) {
    mostrarErro();
    return;
  }

  try {

    var response = await fetch(
      SUPABASE_URL + "/rest/v1/diagnosticos?lead_id=eq." + encodeURIComponent(leadId) + "&publicado=eq.true&select=lead_id,empresa_nome,html_relatorio",
      {
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Erro ao consultar o Supabase");
    }

    var dados = await response.json();

    if (!dados.length) {
      mostrarErro();
      return;
    }

    document.getElementById("loading").style.display = "none";

    document.getElementById("relatorio").innerHTML =
      dados[0].html_relatorio;

    nomeEmpresa = dados[0].empresa_nome || "";

    if (nomeEmpresa) {
      document.title = "Diagnóstico Gerencial — " + nomeEmpresa;
    }

    // O botão "Baixar PDF" do relatório passa a gerar o PDF por código
    var btn = document.querySelector("#relatorio .print-btn");
    if (btn) {
      btn.onclick = function () { gerarPdf(nomeEmpresa); };
    }

    if (!modoPrevia) {
      registrarAcesso(leadId);
    }

    if (modoPdf) {
      setTimeout(function () { gerarPdf(nomeEmpresa); }, 1200);
    }

  } catch (erro) {

    console.error(erro);
    mostrarErro();

  }

}

function gerarPdf(nome) {

  if (gerandoPdf) return;

  // Se a biblioteca não carregou, cai na impressão normal
  if (typeof html2pdf === "undefined") {
    window.print();
    return;
  }

  var alvo = document.querySelector("#relatorio .mig") || document.getElementById("relatorio");
  var btn = document.querySelector("#relatorio .print-btn");
  var aviso = document.getElementById("gerando-pdf");

  gerandoPdf = true;
  if (btn) btn.style.display = "none";
  aviso.style.display = "flex";
  alvo.style.width = "820px"; // força o layout de computador

  var nomeArquivo = "Diagnostico - " + (nome || "clinica").replace(/[\\/:*?"<>|]/g, "") + ".pdf";

  var finalizar = function () {
    alvo.style.width = "";
    if (btn) btn.style.display = "";
    aviso.style.display = "none";
    gerandoPdf = false;
  };

  html2pdf().set({
    margin: 0,
    filename: nomeArquivo,
    image: { type: "jpeg", quality: 0.95 },
    html2canvas: { scale: 2, useCORS: true, windowWidth: 820, scrollY: 0 },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
    pagebreak: {
      mode: ["css"],
      before: ".pg + .pg",
      avoid: [".kpis", ".score-row", ".two", ".voice", ".swot", ".feat", ".vs",
              ".hours", ".ovt", ".price", ".cta", ".dark", ".funnel", ".shots",
              ".pareto", "tr", ".opps li", "h2"]
    }
  }).from(alvo).save().then(finalizar).catch(function (erro) {
    console.error("Erro ao gerar PDF:", erro);
    finalizar();
    window.print();
  });

}

async function registrarAcesso(leadId) {

  try {

    await fetch(
      SUPABASE_URL + "/rest/v1/rpc/registrar_acesso_diagnostico",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },

        body: JSON.stringify({
          p_lead_id: leadId,
          p_user_agent: navigator.userAgent,
          p_referer: document.referrer || null
        })

      }
    );

  } catch (erro) {

    console.error("Erro ao registrar acesso:", erro);

  }

}

function mostrarErro() {

  document.getElementById("loading").style.display = "none";
  document.getElementById("error").style.display = "block";

}

carregarDiagnostico();

</script>

</body>
</html>
